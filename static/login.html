<!doctype html><html lang="el"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#192b3d">
<title>Σύνδεση · Aegean Robotics Inventory</title><link rel="stylesheet" href="/static/app.css">
<style>
body{background:#eef3f6;min-height:100vh;display:grid;place-items:center;margin:0;padding:22px;font-family:system-ui,Arial,sans-serif}
.login-card{width:min(420px,100%);background:white;border:1px solid #d6e3e9;box-shadow:0 18px 50px #10263816;border-radius:20px;overflow:hidden}
.login-head{background:#192b3d;color:white;padding:30px}
.login-head h1{font-size:24px;line-height:1.3;margin:10px 0}.login-head p{font-size:14px;color:#cee2eb;margin:0}
.login-content{padding:28px}.login-content label{font-size:13px;font-weight:700;display:block;margin:14px 0 6px}.login-content input{width:100%;padding:13px;border:1px solid #bdcdd7;border-radius:10px;font-size:16px;box-sizing:border-box}
.login-content button{width:100%;margin-top:25px;border:0;background:#417c94;color:white;padding:14px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}.login-content button:disabled{opacity:.6}
.message{color:#a7283d;background:#fff1f2;padding:10px;border-radius:7px;font-size:13px;margin-top:12px;display:none}
.login-foot{font-size:12px;color:#758997;text-align:center;padding:0 28px 24px}
</style></head><body>
<main class="login-card">
<header class="login-head"><div style="letter-spacing:.14em;font-size:12px;font-weight:700;color:#a9d4df">AEGEAN ROBOTICS</div>
<h1>Smart Laboratory Inventory</h1><p>Πρόσβαση μόνο για εξουσιοδοτημένα μέλη του εργαστηρίου.</p></header>
<div class="login-content"><form id="loginForm">
<label for="username">Όνομα χρήστη</label><input id="username" autocomplete="username" required maxlength="40" autofocus>
<label for="password">Κωδικός πρόσβασης</label><input id="password" type="password" autocomplete="current-password" required>
<div class="message" id="loginError" role="alert"></div>
<button type="submit" id="loginSubmit">Σύνδεση →</button>
</form></div><div class="login-foot">Οι κωδικοί είναι ανεξάρτητοι από το WordPress. Δεν καταχωρίζεις εδώ τους κωδικούς WordPress.</div>
</main><script defer src="/static/login.js"></script></body></html>
